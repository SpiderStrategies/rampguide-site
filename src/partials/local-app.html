<script>
  // Where the app is: trust.rampguide.com, or a local instance when the site is previewed
  // locally (the trust app's `npm run dev`; ?trust=http://localhost:8794 names another).
  // Never anything but trust.rampguide.com on rampguide.com.
  window.RG_APP = (function () {
    var h = location.hostname
    if (h !== 'localhost' && h !== '127.0.0.1') return 'https://trust.rampguide.com'
    return new URLSearchParams(location.search).get('trust') || 'http://localhost:8790'
  })()
</script>
